<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Cloner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Image Cloner</h1>

    <p>
        Usa una imagen como referencia y la cámara como fuente real.
    </p>

    <button id="startCamera">
        Iniciar cámara
    </button>

    <p id="status">
        Cámara detenida
    </p>

    <div class="workspace">

        <div class="panel">
            <h2>Imagen de referencia</h2>

            <img
                id="target"
                src="assets/target.jpg"
                alt="Imagen de referencia">
        </div>

        <div class="panel">
            <h2>Cámara</h2>

            <video
                id="video"
                autoplay
                playsinline
                muted>
            </video>
        </div>

        <div class="panel">
            <h2>Resultado</h2>

            <canvas id="canvas"></canvas>
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
